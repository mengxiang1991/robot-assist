services:
  api:
    build: .
    command: ["api", "--host", "0.0.0.0"]
    ports: ["127.0.0.1:8780:8780"]
    environment:
      ROBOT_ASSIST_WEB_TOKEN: "${ROBOT_ASSIST_WEB_TOKEN:?Set ROBOT_ASSIST_WEB_TOKEN}"
    env_file:
      - .env
    volumes:
      - robot-assist-data:/data
    restart: unless-stopped
  worker:
    build: .
    command: ["worker"]
    env_file:
      - .env
    volumes:
      - robot-assist-data:/data
    restart: unless-stopped
volumes:
  robot-assist-data:

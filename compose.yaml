services:
  api:
    build: .
    command: ["api", "--host", "0.0.0.0"]
    ports: ["127.0.0.1:8780:8780"]
    environment:
      ORBIT_WEB_TOKEN: "${ORBIT_WEB_TOKEN:?Set ORBIT_WEB_TOKEN}"
    env_file:
      - .env
    volumes:
      - orbit-data:/data
    restart: unless-stopped
  worker:
    build: .
    command: ["worker"]
    env_file:
      - .env
    volumes:
      - orbit-data:/data
    restart: unless-stopped
volumes:
  orbit-data:
